server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fingerprinted build assets (index-<hash>.js/.css) never change under a given
  # name, so cache them hard.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The SPA shell MUST always be revalidated. With no Cache-Control, browsers
  # apply heuristic caching and can keep serving a stale index.html that still
  # points at the previous bundle hash — so a deploy silently never reaches
  # users who already have the app cached. no-cache forces a conditional
  # request every load. Mirrors frontend/nginx.conf's fix for the same issue.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
