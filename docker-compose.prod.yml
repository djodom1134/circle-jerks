services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      CIRCLEJERK_ENVIRONMENT: ${CIRCLEJERK_ENVIRONMENT:-production}
      CIRCLEJERK_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://noise.example.com}
      CIRCLEJERK_APP_SECRET: ${APP_SECRET:-replace-with-a-long-random-string}
      CIRCLEJERK_DATABASE_PATH: /app/data/circlejerk.sqlite3
      CIRCLEJERK_REDIS_URL: ${CIRCLEJERK_REDIS_URL:-redis://valkey:6379/0}
      CIRCLEJERK_TIMEZONE: ${CIRCLEJERK_TIMEZONE:-America/Denver}
      CIRCLEJERK_DEFAULT_AIRPORT_ICAO: ${CIRCLEJERK_DEFAULT_AIRPORT_ICAO:-KBJC}
      CIRCLEJERK_ADMIN_USERNAME: ${CIRCLEJERK_ADMIN_USERNAME:-admin}
      CIRCLEJERK_ADMIN_PASSWORD: ${CIRCLEJERK_ADMIN_PASSWORD:-}
      CIRCLEJERK_ADMIN_PASSWORD_HASH: ${CIRCLEJERK_ADMIN_PASSWORD_HASH:-}
      # Admin Google SSO. This file enumerates every variable explicitly, so a
      # var present in .env but missing HERE never reaches the container - and
      # the failure is silent: /admin/auth/methods reports google:false and the
      # login screen renders with no Google button, which reads as a frontend
      # bug. Adding a field to settings.py is not enough; list it here too.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      ADMIN_SUPERUSERS: ${ADMIN_SUPERUSERS:-}
      CIRCLEJERK_BUY_ME_COFFEE_URL: ${CIRCLEJERK_BUY_ME_COFFEE_URL:-https://buymeacoffee.com/djodom}
      CIRCLEJERK_LIVE_SOURCE_PRIORITY: ${CIRCLEJERK_LIVE_SOURCE_PRIORITY:-adsbx,self_hosted,adsb_lol,adsb_fi,airplanes_live,opensky}
      CIRCLEJERK_LIVE_POLL_INTERVAL_SECONDS: ${CIRCLEJERK_LIVE_POLL_INTERVAL_SECONDS:-10}
      CIRCLEJERK_LIVE_SOURCE_MAX_STALENESS_SECONDS: ${CIRCLEJERK_LIVE_SOURCE_MAX_STALENESS_SECONDS:-90}
      CIRCLEJERK_BBOX_MERGE_DISTANCE_NM: ${CIRCLEJERK_BBOX_MERGE_DISTANCE_NM:-5}
      CIRCLEJERK_OPENSKY_HISTORICAL_ENABLED: ${CIRCLEJERK_OPENSKY_HISTORICAL_ENABLED:-false}
      CIRCLEJERK_HISTORY_DATABASE_PATH: ${CIRCLEJERK_HISTORY_DATABASE_PATH:-/app/data/klmo_history.sqlite3}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENSKY: ${OPENSKY:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      ADSBX_RAPIDAPI_KEY: ${ADSBX_RAPIDAPI_KEY:-}
      SELF_HOSTED_FEEDER_BASE_URL: ${SELF_HOSTED_FEEDER_BASE_URL:-}
      FLIGHTAWARE: ${FLIGHTAWARE:-}
      FLIGHTAWARE_ENABLED: ${FLIGHTAWARE_ENABLED:-true}
      FLIGHTAWARE_COLD_START_ENABLED: ${FLIGHTAWARE_COLD_START_ENABLED:-true}
      FLIGHTAWARE_COLD_START_MIN_SAMPLES: ${FLIGHTAWARE_COLD_START_MIN_SAMPLES:-500}
      FLIGHTAWARE_COLD_START_DAILY_BUDGET: ${FLIGHTAWARE_COLD_START_DAILY_BUDGET:-5}
    volumes:
      - /srv/circlejerk/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      CIRCLEJERK_ENVIRONMENT: ${CIRCLEJERK_ENVIRONMENT:-production}
      CIRCLEJERK_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://noise.example.com}
      CIRCLEJERK_APP_SECRET: ${APP_SECRET:-replace-with-a-long-random-string}
      CIRCLEJERK_DATABASE_PATH: /app/data/circlejerk.sqlite3
      CIRCLEJERK_REDIS_URL: ${CIRCLEJERK_REDIS_URL:-redis://valkey:6379/0}
      CIRCLEJERK_TIMEZONE: ${CIRCLEJERK_TIMEZONE:-America/Denver}
      CIRCLEJERK_DEFAULT_AIRPORT_ICAO: ${CIRCLEJERK_DEFAULT_AIRPORT_ICAO:-KBJC}
      CIRCLEJERK_ADMIN_USERNAME: ${CIRCLEJERK_ADMIN_USERNAME:-admin}
      CIRCLEJERK_ADMIN_PASSWORD: ${CIRCLEJERK_ADMIN_PASSWORD:-}
      CIRCLEJERK_ADMIN_PASSWORD_HASH: ${CIRCLEJERK_ADMIN_PASSWORD_HASH:-}
      CIRCLEJERK_BUY_ME_COFFEE_URL: ${CIRCLEJERK_BUY_ME_COFFEE_URL:-https://buymeacoffee.com/djodom}
      CIRCLEJERK_LIVE_SOURCE_PRIORITY: ${CIRCLEJERK_LIVE_SOURCE_PRIORITY:-adsbx,self_hosted,adsb_lol,adsb_fi,airplanes_live,opensky}
      CIRCLEJERK_LIVE_POLL_INTERVAL_SECONDS: ${CIRCLEJERK_LIVE_POLL_INTERVAL_SECONDS:-10}
      CIRCLEJERK_LIVE_SOURCE_MAX_STALENESS_SECONDS: ${CIRCLEJERK_LIVE_SOURCE_MAX_STALENESS_SECONDS:-90}
      CIRCLEJERK_BBOX_MERGE_DISTANCE_NM: ${CIRCLEJERK_BBOX_MERGE_DISTANCE_NM:-5}
      CIRCLEJERK_OPENSKY_HISTORICAL_ENABLED: ${CIRCLEJERK_OPENSKY_HISTORICAL_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENSKY: ${OPENSKY:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      ADSBX_RAPIDAPI_KEY: ${ADSBX_RAPIDAPI_KEY:-}
      SELF_HOSTED_FEEDER_BASE_URL: ${SELF_HOSTED_FEEDER_BASE_URL:-}
      FLIGHTAWARE: ${FLIGHTAWARE:-}
      FLIGHTAWARE_ENABLED: ${FLIGHTAWARE_ENABLED:-true}
      FLIGHTAWARE_COLD_START_ENABLED: ${FLIGHTAWARE_COLD_START_ENABLED:-true}
      FLIGHTAWARE_COLD_START_MIN_SAMPLES: ${FLIGHTAWARE_COLD_START_MIN_SAMPLES:-500}
      FLIGHTAWARE_COLD_START_DAILY_BUDGET: ${FLIGHTAWARE_COLD_START_DAILY_BUDGET:-5}
      CIRCLEJERK_HISTORY_DATABASE_PATH: ${CIRCLEJERK_HISTORY_DATABASE_PATH:-/app/data/klmo_history.sqlite3}
    volumes:
      - /srv/circlejerk/data:/app/data
    depends_on:
      - api
    networks:
      - internal

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # --- The Lost Landing (ledger.circlejerks.live) sidecar --------------------
  # A separate FastAPI service, NOT part of the api/worker image above. It
  # opens the main circlejerks database READ-ONLY (mode=ro URI, enforced in
  # ledger-api/app/db.py) and writes its own derived tables to a completely
  # separate database file/volume, so it can never contend for production's
  # single SQLite write lock. See ledger-api/app/db.py's module docstring.
  ledger-api:
    build:
      context: ./ledger-api
    restart: unless-stopped
    environment:
      LEDGER_ENVIRONMENT: ${CIRCLEJERK_ENVIRONMENT:-production}
      # Opened via a `file:...?mode=ro` URI (see db.open_production_readonly),
      # so SQLite itself refuses any write to this file before it ever reaches
      # application code. This is THE protection — see the volume note below for
      # why a Docker-level :ro mount cannot be used on a live WAL database.
      LEDGER_PRODUCTION_DATABASE_PATH: /prod-data/circlejerk.sqlite3
      # This service's OWN database — daily_operation_rollup and
      # aircraft_home_base live here, nowhere near the production file.
      LEDGER_LEDGER_DATABASE_PATH: /data/ledger.sqlite3
      # Same deployment's live-source credits block as the main api service —
      # not something this service ingests itself, just describes it.
      LEDGER_LIVE_SOURCE_PRIORITY: ${CIRCLEJERK_LIVE_SOURCE_PRIORITY:-adsbx,self_hosted,adsb_lol,adsb_fi,airplanes_live,opensky}
      LEDGER_ADSBX_RAPIDAPI_KEY: ${ADSBX_RAPIDAPI_KEY:-}
      LEDGER_SELF_HOSTED_FEEDER_BASE_URL: ${SELF_HOSTED_FEEDER_BASE_URL:-}
    volumes:
      # Production DB. NOT :ro at the Docker layer — SQLite cannot open a WAL
      # database read-only unless it can map the -shm shared-memory index
      # read-write, and prod is in WAL mode. -shm is transient reader
      # coordination, not database content; every SQLite reader maps it, the
      # running api/worker containers included.
      #
      # The real protection is one layer down: db.open_production_readonly()
      # opens `file:...?mode=ro`, so SQLite ITSELF rejects every INSERT/UPDATE/
      # DELETE/CREATE against this file (10 tests in test_db_boundary.py prove
      # it). Readers never take the write lock, so this cannot contend with
      # production's single writer either.
      - /srv/circlejerk/data:/prod-data
      # This sidecar's OWN writable database. Separate volume, separate file,
      # never the production one.
      - /srv/circlejerk/ledger-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # Same image as ledger-api, second role — exactly the api/worker split the
  # backend service pair already uses. Without this, the rollup is only ever
  # populated by a manual backfill and the published numbers go stale the day
  # after deploy.
  #
  # It rebuilds daily_operation_rollup and aircraft_home_base in THIS service's
  # own database. It never writes to the production file: that is mounted :ro
  # here too, and opened via a mode=ro URI on top of that. So this worker cannot
  # contend for production's single SQLite write lock.
  ledger-worker:
    build:
      context: ./ledger-api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      LEDGER_ENVIRONMENT: ${CIRCLEJERK_ENVIRONMENT:-production}
      LEDGER_PRODUCTION_DATABASE_PATH: /prod-data/circlejerk.sqlite3
      LEDGER_LEDGER_DATABASE_PATH: /data/ledger.sqlite3
      LEDGER_LIVE_SOURCE_PRIORITY: ${CIRCLEJERK_LIVE_SOURCE_PRIORITY:-adsbx,self_hosted,adsb_lol,adsb_fi,airplanes_live,opensky}
      LEDGER_ADSBX_RAPIDAPI_KEY: ${ADSBX_RAPIDAPI_KEY:-}
      LEDGER_SELF_HOSTED_FEEDER_BASE_URL: ${SELF_HOSTED_FEEDER_BASE_URL:-}
    volumes:
      # See ledger-api above: WAL requires a writable -shm; mode=ro in SQLite
      # is what actually forbids writing to the production database.
      - /srv/circlejerk/data:/prod-data
      - /srv/circlejerk/ledger-data:/data
    depends_on:
      - ledger-api
    networks:
      - internal

  # The Lost Landing's static frontend (lostlanding/). Built with
  # VITE_API_BASE=/api (see lostlanding/.env.production) so the browser makes
  # same-origin requests to ledger.circlejerks.live/api/... — Caddy proxies
  # those to ledger-api, so there is zero CORS configuration anywhere, same as
  # frontend/web's relationship to api.
  web-ledger:
    build:
      context: ./lostlanding
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_LEDGER_DOMAIN: ${CADDY_LEDGER_DOMAIN:-}
      # One or more space-separated hostnames the ledger site block also answers
      # for — each a mirror of ledger.circlejerks.live (e.g.
      # "lmco.airfieldeconomics.org klmo.airfieldeconomics.org"). Empty by
      # default; changing this value requires a `caddy` recreate (env vars are
      # only injected at container creation) — see DEPLOY-LEDGER-MIRROR.md.
      CADDY_LEDGER_MIRROR_DOMAIN: ${CADDY_LEDGER_MIRROR_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/circlejerk/caddy/data:/data
      - /srv/circlejerk/caddy/config:/config
    depends_on:
      - api
      - web
    networks:
      - internal

networks:
  internal:
    driver: bridge
