services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      CIRCLEJERK_ENVIRONMENT: ${CIRCLEJERK_ENVIRONMENT:-production}
      CIRCLEJERK_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://noise.example.com}
      CIRCLEJERK_APP_SECRET: ${APP_SECRET:-replace-with-a-long-random-string}
      CIRCLEJERK_DATABASE_PATH: /app/data/circlejerk.sqlite3
      CIRCLEJERK_REDIS_URL: ${CIRCLEJERK_REDIS_URL:-redis://valkey:6379/0}
      CIRCLEJERK_TIMEZONE: ${CIRCLEJERK_TIMEZONE:-America/Denver}
      CIRCLEJERK_DEFAULT_AIRPORT_ICAO: ${CIRCLEJERK_DEFAULT_AIRPORT_ICAO:-KBJC}
      CIRCLEJERK_ADMIN_USERNAME: ${CIRCLEJERK_ADMIN_USERNAME:-admin}
      CIRCLEJERK_ADMIN_PASSWORD: ${CIRCLEJERK_ADMIN_PASSWORD:-}
      CIRCLEJERK_ADMIN_PASSWORD_HASH: ${CIRCLEJERK_ADMIN_PASSWORD_HASH:-}
      CIRCLEJERK_BUY_ME_COFFEE_URL: ${CIRCLEJERK_BUY_ME_COFFEE_URL:-https://buymeacoffee.com/djodom}
      CIRCLEJERK_LIVE_SOURCE_PRIORITY: ${CIRCLEJERK_LIVE_SOURCE_PRIORITY:-adsbx,self_hosted,adsb_lol,adsb_fi,airplanes_live,opensky}
      CIRCLEJERK_LIVE_POLL_INTERVAL_SECONDS: ${CIRCLEJERK_LIVE_POLL_INTERVAL_SECONDS:-10}
      CIRCLEJERK_LIVE_SOURCE_MAX_STALENESS_SECONDS: ${CIRCLEJERK_LIVE_SOURCE_MAX_STALENESS_SECONDS:-90}
      CIRCLEJERK_BBOX_MERGE_DISTANCE_NM: ${CIRCLEJERK_BBOX_MERGE_DISTANCE_NM:-5}
      CIRCLEJERK_OPENSKY_HISTORICAL_ENABLED: ${CIRCLEJERK_OPENSKY_HISTORICAL_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENSKY: ${OPENSKY:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      ADSBX_RAPIDAPI_KEY: ${ADSBX_RAPIDAPI_KEY:-}
      SELF_HOSTED_FEEDER_BASE_URL: ${SELF_HOSTED_FEEDER_BASE_URL:-}
      FLIGHTAWARE: ${FLIGHTAWARE:-}
    volumes:
      - /srv/circlejerk/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      CIRCLEJERK_ENVIRONMENT: ${CIRCLEJERK_ENVIRONMENT:-production}
      CIRCLEJERK_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://noise.example.com}
      CIRCLEJERK_APP_SECRET: ${APP_SECRET:-replace-with-a-long-random-string}
      CIRCLEJERK_DATABASE_PATH: /app/data/circlejerk.sqlite3
      CIRCLEJERK_REDIS_URL: ${CIRCLEJERK_REDIS_URL:-redis://valkey:6379/0}
      CIRCLEJERK_TIMEZONE: ${CIRCLEJERK_TIMEZONE:-America/Denver}
      CIRCLEJERK_DEFAULT_AIRPORT_ICAO: ${CIRCLEJERK_DEFAULT_AIRPORT_ICAO:-KBJC}
      CIRCLEJERK_ADMIN_USERNAME: ${CIRCLEJERK_ADMIN_USERNAME:-admin}
      CIRCLEJERK_ADMIN_PASSWORD: ${CIRCLEJERK_ADMIN_PASSWORD:-}
      CIRCLEJERK_ADMIN_PASSWORD_HASH: ${CIRCLEJERK_ADMIN_PASSWORD_HASH:-}
      CIRCLEJERK_BUY_ME_COFFEE_URL: ${CIRCLEJERK_BUY_ME_COFFEE_URL:-https://buymeacoffee.com/djodom}
      CIRCLEJERK_LIVE_SOURCE_PRIORITY: ${CIRCLEJERK_LIVE_SOURCE_PRIORITY:-adsbx,self_hosted,adsb_lol,adsb_fi,airplanes_live,opensky}
      CIRCLEJERK_LIVE_POLL_INTERVAL_SECONDS: ${CIRCLEJERK_LIVE_POLL_INTERVAL_SECONDS:-10}
      CIRCLEJERK_LIVE_SOURCE_MAX_STALENESS_SECONDS: ${CIRCLEJERK_LIVE_SOURCE_MAX_STALENESS_SECONDS:-90}
      CIRCLEJERK_BBOX_MERGE_DISTANCE_NM: ${CIRCLEJERK_BBOX_MERGE_DISTANCE_NM:-5}
      CIRCLEJERK_OPENSKY_HISTORICAL_ENABLED: ${CIRCLEJERK_OPENSKY_HISTORICAL_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENSKY: ${OPENSKY:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      ADSBX_RAPIDAPI_KEY: ${ADSBX_RAPIDAPI_KEY:-}
      SELF_HOSTED_FEEDER_BASE_URL: ${SELF_HOSTED_FEEDER_BASE_URL:-}
      FLIGHTAWARE: ${FLIGHTAWARE:-}
    volumes:
      - /srv/circlejerk/data:/app/data
    depends_on:
      - api
    networks:
      - internal

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/circlejerk/caddy/data:/data
      - /srv/circlejerk/caddy/config:/config
    depends_on:
      - api
      - web
    networks:
      - internal

networks:
  internal:
    driver: bridge
